<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CPETJYBB2B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AgecoldEx - ALISON LONDOÑO SÁNCHEZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --blanco: #FFFFFF;
            --gris-azulado: #acb2c3;
            --azul-corporativo: #2D4B85;
            --gris-neutro: #767a89;
            --acento: #468fa8;

            --azul-oscuro: #1f3563;
            --acento-oscuro: #35748a;
            --sombra: rgba(45, 75, 133, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #eef1f6 0%, #e4e8f0 45%, #dfe9ec 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* Pantalla de carga del logo */
        .logo-loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, var(--azul-corporativo) 0%, var(--acento) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 0.6s ease-out 1.4s forwards;
        }

         .logo-loading .logo-card {
            background: var(--blanco);
            border-radius: 24px;
            padding: clamp(20px, 6vw, 32px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: zoomIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-loading img {
            width: min(180px, 60vw);
            display: block;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
      

        /* Contenedor principal */
        .main-container {
            width: 100%;
            max-width: 400px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.4s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Tarjeta */
        .vcard-container {
            width: 100%;
            background-color: var(--blanco);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 45px var(--sombra), 0 2px 8px rgba(45, 75, 133, 0.08);
            position: relative;
        }

        .profile-section {
            position: relative;
            height: 128px;
            background-color: var(--azul-corporativo);
            background-image: url('https://raw.githubusercontent.com/Lexa2161/FT-VCard/refs/heads/main/Vcard%20%20.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            overflow: hidden;
        }

        .profile-image-container {
            position: absolute;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: var(--blanco);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
            border: 4px solid var(--blanco);
            box-sizing: content-box;
            z-index: 2;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .watermark-pattern {
            display: none;
        }

        .info-section {
            position: relative;
            z-index: 1;
            padding: 76px 24px 26px;
        }

        .name {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(19px, 5vw, 22px);
            font-weight: 700;
            color: var(--azul-corporativo);
            margin-bottom: 6px;
            text-align: center;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .position {
            display: inline-flex;
            align-self: center;
            font-size: clamp(12.5px, 3.6vw, 13.5px);
            color: var(--acento);
            background: rgba(70, 143, 168, 0.1);
            border: 1px solid rgba(70, 143, 168, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .position-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 26px;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blanco);
            font-size: 19px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            box-shadow: 0 6px 14px rgba(45, 75, 133, 0.22);
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 10px 18px rgba(45, 75, 133, 0.3);
        }

        .action-btn:focus-visible {
            outline: 2px solid var(--acento);
            outline-offset: 3px;
        }

        .email-btn { background-color: var(--azul-corporativo); }
        .phone-btn { background-color: var(--acento); }
        .whatsapp-btn { background-color: #25D366; }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gris-azulado), transparent);
            margin-bottom: 22px;
        }

        .contact-info {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .info-icon {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(45, 75, 133, 0.08);
            color: var(--azul-corporativo);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .info-text {
            flex: 1;
            min-width: 0;
            color: var(--gris-neutro);
            font-size: clamp(13.5px, 3.8vw, 14.5px);
            line-height: 1.4;
            word-break: break-word;
        }

        .info-text a {
            color: var(--azul-corporativo);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .info-text a:hover {
            color: var(--acento);
            text-decoration: underline;
        }

        .info-text .address-label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--acento);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 2px;
        }

        .footer-buttons {
            display: flex;
            gap: 12px;
        }

        .save-btn, .share-btn {
            padding: 13px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14.5px;
            flex: 1;
            justify-content: center;
            min-height: 46px;
        }

        .save-btn {
            background-color: var(--azul-corporativo);
            color: var(--blanco);
        }

        .share-btn {
            background-color: var(--blanco);
            color: var(--azul-corporativo);
            border: 1.5px solid var(--gris-azulado);
        }

        .save-btn:hover, .save-btn:focus-visible {
            background-color: var(--acento);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(70, 143, 168, 0.28);
        }

        .share-btn:hover, .share-btn:focus-visible {
            border-color: var(--acento);
            color: var(--acento);
            transform: translateY(-2px);
        }

        .save-btn:focus-visible, .share-btn:focus-visible {
            outline: 2px solid var(--acento);
            outline-offset: 2px;
        }

        @media (max-width: 380px) {
            .info-section { padding: 72px 18px 22px; }
            .footer-buttons { flex-direction: column; }
            .action-buttons { gap: 12px; }
        }

        @media (max-width: 340px) {
            .profile-image-container { width: 108px; height: 108px; top: 74px; }
            .info-section { padding: 62px 16px 20px; }
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga del logo -->
    <div class="logo-loading" aria-hidden="true">
        <div class="logo-card">
            <img src="https://www.agecoldex.com/site/wp-content/uploads/2026/08/logo_agx.png" alt="Logo AgecoldEx">
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-container">
        <div class="vcard-container">
            <div class="profile-section">
                <div class="watermark-pattern"></div>
            </div>

            <div class="profile-image-container">
                <img class="profile-image" src="https://raw.githubusercontent.com/Lexa2161/FT-VCard/refs/heads/main/ALISON%20LONDO%C3%91O%20.JPG" alt="Foto de ALISON LONDOÑO SÁNCHEZ">
            </div>

            <div class="info-section">
                <h1 class="name">ALISON LONDOÑO SÁNCHEZ</h1>
                <div class="position-wrap">
                    <h2 class="position">Gerente Comercial Regional</h2>
                </div>

                <div class="action-buttons">
                    <button class="action-btn email-btn" title="Enviar correo" aria-label="Enviar correo">
                        <i class="fas fa-envelope"></i>
                    </button>
                    <button class="action-btn phone-btn" title="Llamar" aria-label="Llamar">
                        <i class="fas fa-phone"></i>
                    </button>
                    <button class="action-btn whatsapp-btn" title="WhatsApp" aria-label="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </button>
                </div>

                <div class="divider"></div>

                <div class="contact-info">
                    <div class="info-item">
                        <span class="info-icon"><i class="fas fa-mobile-alt"></i></span>
                        <div class="info-text">3104514173</div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon"><i class="fas fa-envelope"></i></span>
                        <div class="info-text"><a href="mailto:alison.londono@agecoldex.com">alison.londono@agecoldex.com</a></div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon"><i class="fas fa-globe"></i></span>
                        <div class="info-text"><a href="https://www.agecoldex.com/site/" target="_blank">https://www.agecoldex.com/site/</a></div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon"><i class="fas fa-map-marker-alt"></i></span>
                        <div class="info-text">Calle 7 Sur # 42-70, Medellín, Colombia</div>
                    </div>
                </div>

                <div class="footer-buttons">
                    <button class="save-btn">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <button class="share-btn">
                        <i class="fas fa-share-alt"></i> Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.email-btn').onclick = () => window.location.href = 'mailto:alison.londono@agecoldex.com';
        document.querySelector('.phone-btn').onclick = () => window.location.href = 'tel:+573104514173';
        document.querySelector('.whatsapp-btn').onclick = () => window.open('https://wa.me/573104514173', '_blank');

        document.querySelector('.save-btn').onclick = () => {
            const vcard = `BEGIN:VCARD
VERSION:3.0
FN:ALISON LONDOÑO SÁNCHEZ
TITLE:Gerente Comercial Regional
ORG:AgecoldEx
TEL;TYPE=CELL:+573104514173
EMAIL:alison.londono@agecoldex.com
URL:https://www.agecoldex.com/site/
ADR;TYPE=WORK:;;Calle 7 Sur # 42-70, Medellín, Colombia;;;;
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'ALISON_LONDONO_SANCHEZ.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        document.querySelector('.share-btn').onclick = () => {
            if (navigator.share) {
                navigator.share({
                    title: 'Contacto: ALISON LONDOÑO SÁNCHEZ',
                    text: 'Datos de contacto de ALISON LONDOÑO SÁNCHEZ - Gerente Comercial Regional en AgecoldEx',
                    url: window.location.href
                }).catch(fallbackShare);
            } else {
                fallbackShare();
            }
        };

        function fallbackShare() {
            const shareText = `Nombre: ALISON LONDOÑO SÁNCHEZ
Cargo: Gerente Comercial Regional
Teléfono: 3104514173
Email: alison.londono@agecoldex.com
Sitio web: https://www.agecoldex.com/site/
Dirección: Calle 7 Sur # 42-70, Medellín, Colombia`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => alert('Datos copiados al portapapeles.'));
            } else {
                alert('Copie los siguientes datos para compartir:\n\n' + shareText);
            }
        }
    </script>
</body>
</html>
